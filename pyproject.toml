[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "paperkit"
version = "0.1.0"
description = "Write a research paper once; get submission-ready LaTeX for IEEE, Springer Nature, Springer LNCS, Elsevier, MDPI, ACM, Taylor & Francis and arXiv."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Janin A Apurba"}]
dependencies = ["pyyaml>=6", "pillow>=9"]

[project.optional-dependencies]
pdf = ["pypdfium2"]

[project.scripts]
paperkit = "paperkit.__main__:main"

[tool.setuptools.packages.find]
include = ["paperkit*"]

[tool.setuptools.package-data]
paperkit = ["starter/*", "starter/figures/*"]
